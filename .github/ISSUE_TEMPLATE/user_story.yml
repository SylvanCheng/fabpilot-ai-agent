name: User story
description: A vertical slice of user value
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      value: |
        As a <role>,
        I want <capability>,
        so that <value>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: [Must, Should, Could, Won't now]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
