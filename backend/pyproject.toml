[project]
name = "fabpilot"
version = "0.1.0"
description = "FabPilot backend: self-hosted LLM agent for industrial process & quality data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "httpx>=0.28",
]

[project.scripts]
fabpilot-datagen = "fabpilot.devtools.datagen.cli:main"
fabpilot-datasets = "fabpilot.devtools.datasets.cli:main"
fabpilot-export-openapi = "fabpilot.devtools.export_openapi:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running PostgreSQL initialised with db/init (skipped otherwise)",
]
addopts = "-ra"
filterwarnings = [
    # Starlette nudges towards httpx2; harmless for TestClient.
    "ignore:Using `httpx` with `starlette.testclient`",
]

# Architecture rules, checked in CI with `uv run lint-imports`.
# See docs/architecture.md for the reasoning behind each contract.
[tool.importlinter]
root_package = "fabpilot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: composition root -> modules -> core"
type = "layers"
layers = [
    "fabpilot.devtools",
    "fabpilot.main",
    "fabpilot.modules",
    "fabpilot.core",
]

[[tool.importlinter.contracts]]
name = "Modules are independent of each other"
type = "independence"
modules = [
    "fabpilot.modules.health",
    "fabpilot.modules.fabdata",
    "fabpilot.modules.llm",
]

[[tool.importlinter.contracts]]
name = "Domain code (service, ports) is framework- and driver-free"
type = "forbidden"
source_modules = [
    "fabpilot.modules.*.service",
    "fabpilot.modules.*.ports",
]
forbidden_modules = ["fastapi", "sqlalchemy", "psycopg", "httpx"]

[[tool.importlinter.contracts]]
name = "Only adapters and wiring pick concrete infrastructure"
type = "forbidden"
source_modules = ["fabpilot.modules.*.api"]
forbidden_modules = ["fabpilot.modules.*.adapters", "sqlalchemy", "psycopg"]
